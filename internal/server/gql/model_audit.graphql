enum ModelAuditStatus {
  matched
  mismatched
  unknown
  conflicting
}

type RequestModelAudit {
  status: ModelAuditStatus!
  "Upstream names that matched their corresponding sent name on executions with model evidence."
  matchedUpstreamIds: [String!]!
  upstreamModelIds: [String!]!
  mismatchedModelIds: [String!]!
  conflictingModelIds: [String!]!
  unknownCount: Int!
  comparedCount: Int!
  conflictCount: Int!
}

extend type Request {
  """Model-name audit over all executions, independent of execution pagination."""
  modelAudit: RequestModelAudit!
}
